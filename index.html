    <script>
      // Suppress Vite dev client WebSocket / HMR connection errors in iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) || String(reason || '');
        var stack = (reason && reason.stack) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          stack.indexOf('@vite/client') !== -1 ||
          msg.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var fn = (event && event.filename) || '';
        var msg = (event && event.message) || '';
        if (fn.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
